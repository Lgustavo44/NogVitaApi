<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>NogVita · social preview</title>
<!--
  Fonte da imagem de "Social preview" do GitHub (docs/assets/social-preview.png, 1280×640).
  Para regerar:
  chrome --headless=new --hide-scrollbars --force-device-scale-factor=1 --window-size=1280,640 --screenshot=social-preview.png social-preview.html
-->
<style>
  :root {
    --orange: #F28C28;
    --pulp: #FFD08A;
    --dark: #1D2A24;
    --muted: #4A5A52;
    --cream: #FFF8EE;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 640px; overflow: hidden; }
  body {
    background: var(--cream);
    font-family: Arial, Helvetica, sans-serif;
    color: var(--dark);
    position: relative;
  }
  .stripe { position: absolute; left: 0; top: 0; width: 100%; height: 14px; background: var(--orange); }
  .slice { position: absolute; right: -170px; top: 50%; transform: translateY(-50%); width: 620px; height: 620px; }
  .content { position: absolute; left: 96px; top: 50%; transform: translateY(-50%); width: 700px; }
  .logo { width: 560px; height: auto; display: block; margin-left: -22px; }
  .tagline { margin-top: 28px; font-size: 40px; line-height: 1.25; font-weight: 700; }
  .tagline em { font-style: normal; color: var(--orange); }
  .subtitle { margin-top: 18px; font-size: 24px; line-height: 1.4; color: var(--muted); }
  .chips { margin-top: 38px; display: flex; flex-wrap: wrap; gap: 12px; }
  .chip {
    font-size: 20px; font-weight: 700; padding: 10px 18px; border-radius: 999px;
    background: #FFFFFF; border: 2px solid var(--pulp); color: var(--dark);
  }
</style>
</head>
<body>
  <div class="stripe"></div>

  <svg class="slice" viewBox="0 0 512 512" aria-hidden="true">
    <circle cx="256" cy="256" r="240" fill="#F28C28"/>
    <circle cx="256" cy="256" r="192" fill="#FFD08A"/>
    <g stroke="#F28C28" stroke-width="19.2" stroke-linecap="round">
      <line x1="64" y1="256" x2="448" y2="256"/>
      <line x1="120.24" y1="120.24" x2="391.76" y2="391.76"/>
      <line x1="256" y1="64" x2="256" y2="448"/>
      <line x1="391.76" y1="120.24" x2="120.24" y2="391.76"/>
    </g>
  </svg>

  <div class="content">
    <svg class="logo" viewBox="0 0 496 150" role="img" aria-label="NogVita">
      <g font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="120" fill="#1D2A24">
        <text x="94" y="118" text-anchor="end">N</text>
        <text x="178" y="118">gVita</text>
      </g>
      <circle cx="136" cy="85" r="36" fill="#F28C28"/>
      <circle cx="136" cy="85" r="28.8" fill="#FFD08A"/>
      <g stroke="#F28C28" stroke-width="2.88" stroke-linecap="round">
        <line x1="107.2" y1="85" x2="164.8" y2="85"/>
        <line x1="115.64" y1="64.64" x2="156.36" y2="105.36"/>
        <line x1="136" y1="56.2" x2="136" y2="113.8"/>
        <line x1="156.36" y1="64.64" x2="115.64" y2="105.36"/>
      </g>
    </svg>

    <p class="tagline">Acompanhamento nutricional que conecta <em>pacientes</em> e <em>nutricionistas</em></p>
    <p class="subtitle">Planos alimentares com refeições e horários,<br>e uma base de alimentos da TACO e do Open Food Facts</p>

    <div class="chips">
      <span class="chip">.NET 10</span>
      <span class="chip">ASP.NET Core</span>
      <span class="chip">PostgreSQL</span>
      <span class="chip">Clean Architecture</span>
    </div>
  </div>
</body>
</html>
